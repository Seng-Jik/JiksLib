name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          10.0.x
          11.0.x

    - name: Restore dependencies
      run: dotnet restore ./JiksLib.slnx

    - name: Build
      run: dotnet build ./JiksLib.slnx --configuration Release --no-restore

    - name: Test .NET 10.0
      run: dotnet test ./JiksLib.Test/JiksLib.Test.csproj --configuration Release --framework net10.0 --no-build --verbosity normal

    - name: Test .NET 11.0
      run: dotnet test ./JiksLib.Test/JiksLib.Test.csproj --configuration Release --framework net11.0 --no-build --verbosity normal

    - name: Test .NET Framework 4.8
      run: dotnet test ./JiksLib.Test/JiksLib.Test.csproj --configuration Release --framework net48 --no-build --verbosity normal

  build-linux:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          10.0.x
          11.0.x

    - name: Restore dependencies
      run: dotnet restore ./JiksLib.slnx

    - name: Build
      run: dotnet build ./JiksLib.slnx --configuration Release --no-restore

    - name: Test .NET 10.0
      run: dotnet test ./JiksLib.Test/JiksLib.Test.csproj --configuration Release --framework net10.0 --no-build --verbosity normal

    - name: Test .NET 11.0
      run: dotnet test ./JiksLib.Test/JiksLib.Test.csproj --configuration Release --framework net11.0 --no-build --verbosity normal

    - name: Build .NET Standard 2.1
      # Note: Test project doesn't target netstandard2.1, but we can build the library for it
      run: dotnet build ./JiksLib/JiksLib.csproj --configuration Release --framework netstandard2.1 --no-restore

  build-mac:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          10.0.x
          11.0.x

    - name: Restore dependencies
      run: dotnet restore ./JiksLib.slnx

    - name: Build
      run: dotnet build ./JiksLib.slnx --configuration Release --no-restore

    - name: Test .NET 10.0
      run: dotnet test ./JiksLib.Test/JiksLib.Test.csproj --configuration Release --framework net10.0 --no-build --verbosity normal

    - name: Test .NET 11.0
      run: dotnet test ./JiksLib.Test/JiksLib.Test.csproj --configuration Release --framework net11.0 --no-build --verbosity normal

    - name: Build .NET Standard 2.1
      run: dotnet build ./JiksLib/JiksLib.csproj --configuration Release --framework netstandard2.1 --no-restore
